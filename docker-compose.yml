services:
  postgres:
    image: postgres:16-alpine
    container_name: newra-comparator-postgres
    environment:
      POSTGRES_USER: newra
      POSTGRES_PASSWORD: newra
      POSTGRES_DB: newra_comparator
    ports:
      - "5435:5432"
    volumes:
      - newra_comparator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newra -d newra_comparator"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  newra_comparator_pg:
